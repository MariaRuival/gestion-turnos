name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6
      
      - name: Login a Docker Hub (pulls autenticados, evita el 429 del pool anonimo)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/backend-coverage:/app/coverage" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa collectCoverageFrom'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('statements')); console.log(f('functions')); console.log(f('branches'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Nombre de la imagen en minusculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Login a Docker Hub (pulls autenticados, evita el 429 del pool anonimo)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/coverage \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/coverage/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('statements')); console.log(f('functions')); console.log(f('branches'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Nombre de la imagen en minusculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/mariaruival/gestion-turnos-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/mariaruival/gestion-turnos-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA conteste CON el commit correcto)
        shell: bash
        env:
          URL_API: https://turnos-api-qa.onrender.com
          URL_FRONT: https://turnos-front-qa.onrender.com
        run: |
          echo "Esperando a que QA responda con el commit $GITHUB_SHA..."
          for i in $(seq 1 30); do
            # /health solo trae commit si la base contesto (SELECT 1), y el
            # commit tiene que ser ESTE: asi no da verde contra la imagen vieja.
            BODY=$(curl -s --max-time 10 "$URL_API/health" || true)
            COMMIT=$(echo "$BODY" | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d).commit||'')}catch{console.log('')}})" 2>/dev/null)
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/api/salud" > /dev/null \
               && curl -fsS -o /dev/null --max-time 10 "$URL_FRONT/"; then
              echo "✅ QA responde con el commit correcto (API + BD + front)"; exit 0
            fi
            echo "Intento $i/30: todavia no responde con el commit esperado (commit='$COMMIT'), reintento en 20s"
            sleep 20
          done
          echo "❌ QA no respondio con el commit correcto a tiempo"; exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci
      - name: Instalar Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Esperar a que la API este despierta (cold start)
        run: |
          for i in $(seq 1 10); do
            curl -fsS --max-time 10 https://turnos-api-qa.onrender.com/health > /dev/null && break
            echo "Intento $i/10: todavia no responde, reintento en 10s"
            sleep 10
          done
      - name: Suite de integracion contra QA
        working-directory: ./frontend
        env:
          API_BASE_URL: https://turnos-api-qa.onrender.com
        run: npx playwright test e2e/api.spec.js
      - name: Publicar el reporte de integracion
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  e2e:
    runs-on: ubuntu-latest
    needs: [integracion]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci
      - name: Instalar Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Esperar a que la API (con la base) y el front esten despiertos (cold start)
        run: |
          for i in $(seq 1 10); do
            # /health hace SELECT 1: despierta la API y la base, no solo el front.
            curl -fsS --max-time 10 https://turnos-api-qa.onrender.com/health > /dev/null \
              && curl -fsS --max-time 10 -o /dev/null https://turnos-front-qa.onrender.com/ \
              && break
            echo "Intento $i/10: todavia no responde, reintento en 10s"
            sleep 10
          done
      - name: Suite e2e contra QA
        working-directory: ./frontend
        env:
          E2E_BASE_URL: https://turnos-front-qa.onrender.com
        run: npx playwright test e2e/tareas.spec.js
      - name: Publicar el reporte de e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [integracion, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar en PROD la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/mariaruival/gestion-turnos-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/mariaruival/gestion-turnos-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que PROD conteste CON el commit correcto)
        shell: bash
        env:
          URL_API: https://turnos-api-prod.onrender.com
          URL_FRONT: https://turnos-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD responda con el commit $GITHUB_SHA..."
          for i in $(seq 1 30); do
            # /health solo trae commit si la base contesto (SELECT 1), y el
            # commit tiene que ser ESTE: asi no da verde contra la imagen vieja.
            BODY=$(curl -s --max-time 10 "$URL_API/health" || true)
            COMMIT=$(echo "$BODY" | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d).commit||'')}catch{console.log('')}})" 2>/dev/null)
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/api/salud" > /dev/null \
               && curl -fsS -o /dev/null --max-time 10 "$URL_FRONT/"; then
              echo "✅ PROD responde con el commit correcto (API + BD + front)"; exit 0
            fi
            echo "Intento $i/30: todavia no responde con el commit esperado (commit='$COMMIT'), reintento en 20s"
            sleep 20
          done
          echo "❌ PROD no respondio con el commit correcto a tiempo"; exit 1
